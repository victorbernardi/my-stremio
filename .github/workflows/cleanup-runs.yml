name: Limpeza de logs antigos

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-runs.yml"]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 42032864178 42024632831 42022999963 42020195888; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" && echo "apagado $id"
          done
