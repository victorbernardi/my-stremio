name: Recomendações diárias

on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 em Brasília (09:17 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "requirements.txt", ".github/workflows/daily.yml", ".github/refresh"]

permissions:
  contents: write   # grava o histórico criptografado na branch "data"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Gerar catálogo
        env:
          PYTHONPATH: src
          STREMIO_AUTH_KEY: ${{ secrets.STREMIO_AUTH_KEY }}
          STREMIO_EMAIL: ${{ secrets.STREMIO_EMAIL }}
          STREMIO_PASSWORD: ${{ secrets.STREMIO_PASSWORD }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_ACCOUNT_ID: ${{ secrets.TMDB_ACCOUNT_ID }}
          TMDB_SESSION_ID: ${{ secrets.TMDB_SESSION_ID }}
          TMDB_USERNAME: ${{ secrets.TMDB_USERNAME }}
          TMDB_PASSWORD: ${{ secrets.TMDB_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          COMMAND_CODE_API_KEY: ${{ secrets.COMMAND_CODE_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          SNAPSHOT_PATH: ${{ runner.temp }}/snapshot.json
          IMPORT_KEY: ${{ secrets.IMPORT_KEY }}
        run: python -m my_stremio.pipeline build/addon
      - name: Registrar recomendações do dia (criptografado)
        env:
          IMPORT_KEY: ${{ secrets.IMPORT_KEY }}
          SNAP: ${{ runner.temp }}/snapshot.json
        run: |
          set -euo pipefail
          [ -f "$SNAP" ] || exit 0
          T="$RUNNER_TEMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin data; then git worktree add -q "$T/data" origin/data; git -C "$T/data" checkout -q -B data;
          else git worktree add -q --orphan -b data "$T/data"; fi
          if [ -f "$T/data/history.enc" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:IMPORT_KEY -in "$T/data/history.enc" -out "$T/history.jsonl"
          fi
          python scripts/history.py "$T/history.jsonl" "$SNAP"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:IMPORT_KEY -in "$T/history.jsonl" -out "$T/data/history.enc"
          rm -f "$T/history.jsonl" "$SNAP"
          git -C "$T/data" add history.enc
          git -C "$T/data" commit -qm "Histórico $(date -u +%F)" && git -C "$T/data" push -q origin data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/addon

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
