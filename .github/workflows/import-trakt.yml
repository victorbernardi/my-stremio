name: Importação única Trakt -> TMDB

on:
  push:
    branches: [main]
    paths: ["import/trakt.enc"]

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Descriptografar e importar
        env:
          IMPORT_KEY: ${{ secrets.IMPORT_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_USERNAME: ${{ secrets.TMDB_USERNAME }}
          TMDB_PASSWORD: ${{ secrets.TMDB_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:IMPORT_KEY -in import/trakt.enc -out "$RUNNER_TEMP/trakt.json"
          python scripts/import_trakt.py "$RUNNER_TEMP/trakt.json"
          rm -f "$RUNNER_TEMP/trakt.json"
